name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  extension-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate extension manifest and required files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('apps/extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert any(pattern in manifest['content_scripts'][0]['matches'] for pattern in ['http://*/*', 'https://*/*'])
          for name in ['background.js', 'content.js', 'popup.html', 'popup.js', 'options.html', 'options.js']:
              assert (root / name).exists(), name
          print('Extension structure is valid')
          PY
      - name: Check extension JavaScript syntax
        run: |
          node --check apps/extension/background.js
          node --check apps/extension/content.js
          node --check apps/extension/popup.js
          node --check apps/extension/options.js
